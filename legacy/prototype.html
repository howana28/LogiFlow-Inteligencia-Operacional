<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LogiFlow — Sistema Logístico | Portfolio Demo</title>
<meta name="description" content="Demonstração de sistema logístico para portfólio, com dados fictícios." />
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#f4f3ed;--surface:#fff;--surface2:#f8f8f4;--ink:#182017;--muted:#667063;--line:#dfe3da;
  --forest:#162016;--forest2:#1e2a1d;--sage:#aebd8d;--lime:#dbe7a8;--gold:#c89c55;--amber:#e7b464;
  --red:#b55f59;--blue:#5f7d84;--shadow:0 16px 48px rgba(24,32,23,.08);--radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:var(--forest);color:#eff2e8;position:fixed;inset:0 auto 0 0;padding:24px 18px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.09)}
.brandmark{width:42px;height:42px;border-radius:13px;border:1px solid rgba(219,231,168,.28);display:grid;place-items:center;background:rgba(219,231,168,.08);font-weight:700;color:var(--lime);letter-spacing:-1px}
.brand h1{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;margin:0;letter-spacing:.2px}.brand small{display:block;color:#9ca995;margin-top:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.module-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:18px 4px 14px}.module-btn{border:0;border-radius:10px;padding:9px 4px;background:rgba(255,255,255,.04);color:#aeb8a7;font-size:11px;font-weight:700;cursor:pointer;transition:.2s}.module-btn:hover{background:rgba(255,255,255,.08);color:white}.module-btn.active{background:var(--lime);color:var(--forest)}
.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#7f8c79;padding:10px 10px 8px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#b9c3b3;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}.nav button:hover{background:rgba(255,255,255,.055);color:white}.nav button.active{background:rgba(219,231,168,.12);color:var(--lime)}.dot{width:7px;height:7px;border-radius:99px;border:1px solid currentColor}.nav button.active .dot{background:currentColor}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding:16px 8px 2px}.demo-badge{font-size:11px;border:1px solid rgba(219,231,168,.22);color:#c8d2bd;background:rgba(219,231,168,.07);padding:9px 10px;border-radius:10px;line-height:1.4}.profile{display:flex;align-items:center;gap:10px;margin-top:14px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--forest);display:grid;place-items:center;font-weight:800}.profile b{font-size:12px}.profile span{display:block;color:#8e9a88;font-size:10.5px;margin-top:2px}
.main{margin-left:270px;width:calc(100% - 270px)}.topbar{height:72px;position:sticky;top:0;z-index:10;background:rgba(244,243,237,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(24,32,23,.08);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-actions{display:flex;gap:9px;align-items:center}.ghost,.primary{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}.primary{background:var(--forest);color:white;border-color:var(--forest)}.ghost:hover{background:#fafaf7}.primary:hover{background:#253224}
.content{max-width:1300px;margin:0 auto;padding:34px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#76806f;font-weight:700;margin-bottom:8px}.hero h2{font-family:'DM Serif Display',serif;font-size:34px;line-height:1.05;font-weight:400;margin:0}.hero p{color:var(--muted);font-size:13px;margin:10px 0 0;max-width:650px;line-height:1.55}.timestamp{text-align:right;font-size:11px;color:#7c8577;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 10px rgba(24,32,23,.02)}.kpi{padding:18px}.kpi-top{display:flex;align-items:center;justify-content:space-between}.kpi-label{color:#6d7667;font-size:11.5px;font-weight:600}.kpi-icon{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:14px}.kpi-value{font-family:'DM Serif Display',serif;font-size:30px;margin:12px 0 5px}.delta{font-size:11px;color:#75806e}.delta.good{color:#5e7659}.delta.warn{color:#a16f2f}.delta.bad{color:#a45752}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:19px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.panel h3{font-size:13px;margin:0;font-weight:800}.panel small{display:block;color:#7b8576;margin-top:4px;font-size:11px}.tag{font-size:10px;padding:5px 7px;border-radius:999px;background:#f0f3e9;color:#60704f;border:1px solid #dfe6d3;font-weight:700}
.bars{display:flex;flex-direction:column;gap:12px}.bar-row{display:grid;grid-template-columns:130px 1fr 42px;gap:10px;align-items:center;font-size:11px}.bar-track{height:8px;border-radius:99px;background:#edf0e9;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#91a571,#c5d395)}.bar-value{text-align:right;font-weight:700}
.ring-wrap{display:flex;align-items:center;gap:24px;padding:12px 6px 8px}.ring{--p:76;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--forest) calc(var(--p)*1%),#e8ebe3 0);position:relative}.ring:after{content:'';position:absolute;inset:18px;border-radius:50%;background:white}.ring-center{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center}.ring-center b{font-family:'DM Serif Display',serif;font-size:27px}.ring-center span{display:block;font-size:9.5px;color:var(--muted);margin-top:-14px}.legend{display:flex;flex-direction:column;gap:10px;font-size:11px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:8px;height:8px;border-radius:50%;background:var(--forest)}.legend div:nth-child(2) i{background:#afbe8e}.legend div:nth-child(3) i{background:#e6e9df}
.table-card{margin-top:16px;overflow:hidden}.table-toolbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}.search{width:min(420px,100%);border:1px solid var(--line);background:#fbfbf8;border-radius:10px;padding:10px 12px;font-size:12px;outline:none}.search:focus{border-color:#aab793;box-shadow:0 0 0 3px rgba(174,189,141,.18)}.filters{display:flex;gap:8px}.filters select{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 10px;font-size:11.5px;color:#4d5749}
table{width:100%;border-collapse:collapse}th{text-align:left;padding:11px 16px;background:#fafaf7;border-bottom:1px solid var(--line);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#788173}td{padding:13px 16px;border-bottom:1px solid #edf0e9;font-size:11.5px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcf8}.mono{font-variant-numeric:tabular-nums;font-weight:600}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:700}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.status.green{background:#edf4e8;color:#607958}.status.amber{background:#fbf3e4;color:#a26e2e}.status.red{background:#f7e9e8;color:#a6534e}.status.blue{background:#eaf0f2;color:#5f7b82}.status.gray{background:#eff0ed;color:#747a71}
.form-card{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6d7667;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbfbf8;font-size:12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9bab81;box-shadow:0 0 0 3px rgba(174,189,141,.16)}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.note{margin:14px 0 0;padding:11px 13px;border-radius:10px;background:#f1f4eb;border:1px solid #e0e6d6;font-size:11px;color:#5e6858}
.stock-map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rack{padding:14px;border:1px solid var(--line);background:white;border-radius:14px}.rack h4{font-size:12px;margin:0 0 10px}.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bin{aspect-ratio:1.1;border-radius:8px;background:#eef1e9;border:1px solid #dfe4da;display:grid;place-items:center;font-size:9px;font-weight:700;color:#75806f}.bin.hot{background:#f8ecd8;border-color:#ead0a8;color:#976325}.bin.full{background:#dfe9d4;border-color:#c7d7b8;color:#5c7456}
.empty{padding:44px;text-align:center;color:#7a8376}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:#172016;color:white;padding:12px 15px;border-radius:11px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.stock-map{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%}.side-foot{display:none}.topbar{position:static;padding:0 18px}.content{padding:22px 16px}.hero{align-items:flex-start;flex-direction:column}.timestamp{text-align:left}.kpis{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stock-map{grid-template-columns:1fr}.table-card{overflow:auto}.module-switch{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">LF</div><div><h1>LogiFlow</h1><small>Operations Intelligence</small></div></div>
    <div class="module-switch" id="moduleSwitch"></div>
    <div class="nav-title" id="navTitle">Navegação</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="demo-badge"><b>Demo para portfólio</b><br>Todos os dados exibidos são fictícios.</div>
      <div class="profile"><div class="avatar">AM</div><div><b>Ana Mendes</b><span>Full Stack Developer</span></div></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">LogiFlow / <strong id="crumbModule">Estoque</strong> / <span id="crumbPage">Dashboard</span></div><div class="top-actions"><button class="ghost" id="exportBtn">Exportar CSV</button><button class="primary" id="quickBtn">+ Nova movimentação</button></div></header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const state={module:'estoque',page:'dashboard',search:'',filter:'todos'};
const data={
 estoque:[
  {sku:'SKU-1048',produto:'Kit Essencial Skin Care',marca:'Aurora',local:'A-01',caixa:'CX-014',saldo:126,status:'Disponível'},
  {sku:'SKU-2071',produto:'Body Splash Citrus 120ml',marca:'Lumé',local:'A-02',caixa:'CX-022',saldo:98,status:'Disponível'},
  {sku:'SKU-3310',produto:'Óleo Corporal Botânico',marca:'Nativa',local:'B-01',caixa:'CX-037',saldo:84,status:'Disponível'},
  {sku:'SKU-1832',produto:'Sabonete Líquido Lavanda',marca:'Essenza',local:'B-03',caixa:'CX-041',saldo:62,status:'Baixo giro'},
  {sku:'SKU-4205',produto:'Hidratante Corporal 200ml',marca:'Aurora',local:'C-02',caixa:'CX-056',saldo:51,status:'Disponível'},
  {sku:'SKU-2914',produto:'Kit Presente Vanilla',marca:'Lumé',local:'C-04',caixa:'CX-063',saldo:39,status:'Reposição'},
  {sku:'SKU-1099',produto:'Sérum Facial Vitamina C',marca:'Nativa',local:'D-01',caixa:'CX-071',saldo:28,status:'Disponível'},
  {sku:'SKU-5120',produto:'Esfoliante Corporal Café',marca:'Essenza',local:'D-03',caixa:'CX-079',saldo:17,status:'Crítico'}
 ],
 devolucoes:[
  {pedido:'#MLB-891240',market:'Mercado Livre',sku:'SKU-1048',qtd:2,motivo:'Arrependimento',status:'A revisar',data:'24/09/2026'},
  {pedido:'#SHP-442108',market:'Shopee',sku:'SKU-2071',qtd:1,motivo:'Embalagem avariada',status:'Conferência',data:'24/09/2026'},
  {pedido:'#SHE-731992',market:'Shein',sku:'SKU-3310',qtd:3,motivo:'Item divergente',status:'A revisar',data:'23/09/2026'},
  {pedido:'#WEB-194205',market:'Site',sku:'SKU-1832',qtd:1,motivo:'Desistência',status:'Concluída',data:'23/09/2026'},
  {pedido:'#MLB-890771',market:'Mercado Livre',sku:'SKU-4205',qtd:2,motivo:'Não serviu',status:'Concluída',data:'22/09/2026'}
 ],
 recebimentos:[
  {fornecedor:'Orion Distribuidora',nf:'NF 0008491',previsao:'25/09/2026',volumes:18,unidades:420,status:'A caminho'},
  {fornecedor:'Prime Supply Co.',nf:'NF 0008498',previsao:'25/09/2026',volumes:9,unidades:216,status:'Conferência'},
  {fornecedor:'Atlas Comercial',nf:'NF 0008510',previsao:'26/09/2026',volumes:22,unidades:580,status:'A caminho'},
  {fornecedor:'Nexus Import',nf:'NF 0008517',previsao:'27/09/2026',volumes:13,unidades:305,status:'Programado'},
  {fornecedor:'Vértice Atacado',nf:'NF 0008522',previsao:'28/09/2026',volumes:7,unidades:168,status:'Programado'}
 ],
 movimentos:[
  {data:'25/09 08:42',tipo:'Entrada',sku:'SKU-1048',qtd:24,origem:'Recebimento',responsavel:'Mariana Costa'},
  {data:'25/09 08:18',tipo:'Retirada',sku:'SKU-3310',qtd:6,origem:'Separação',responsavel:'Lucas Freitas'},
  {data:'24/09 17:55',tipo:'Transferência',sku:'SKU-2071',qtd:18,origem:'A-02 → C-01',responsavel:'Beatriz Melo'},
  {data:'24/09 16:31',tipo:'Entrada',sku:'SKU-4205',qtd:32,origem:'Devolução aprovada',responsavel:'Mariana Costa'},
  {data:'24/09 15:02',tipo:'Retirada',sku:'SKU-1832',qtd:10,origem:'Ajuste operacional',responsavel:'Rafael Nunes'}
 ]
};
const modules={
 estoque:{label:'Estoque',pages:[['dashboard','Dashboard'],['entrada','Entrada de estoque'],['retirada','Retirada'],['movimentacoes','Movimentações'],['mapa','Mapa de estoque'],['posicoes','Posições atuais']]},
 devolucoes:{label:'Devoluções',pages:[['dashboard','Dashboard'],['nova','Nova devolução'],['revisar','A revisar'],['conferencia','Conferência'],['historico','Histórico']]},
 recebimento:{label:'Recebimento',pages:[['dashboard','Dashboard'],['compra','Nova compra'],['caminho','A caminho'],['conferencia','Conferência'],['processados','Processados']]}
};
function money(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function n(n){return Number(n).toLocaleString('pt-BR')}
function statusClass(s){s=s.toLowerCase();if(/conclu|dispon|processado/.test(s))return'green';if(/revis|caminho|baixo/.test(s))return'amber';if(/crítico|avari|atras/.test(s))return'red';if(/confer/.test(s))return'blue';return'gray'}
function hero(title,sub,ey='Visão operacional'){return `<div class="hero"><div><div class="eyebrow">${ey}</div><h2>${title}</h2><p>${sub}</p></div><div class="timestamp">Atualizado em 25 set 2026 · 09:38<br><b>Ambiente demonstrativo</b></div></div>`}
function kpi(label,value,delta,kind=''){return `<div class="card kpi"><div class="kpi-top"><div class="kpi-label">${label}</div><div class="kpi-icon">↗</div></div><div class="kpi-value">${value}</div><div class="delta ${kind}">${delta}</div></div>`}
function bars(items){let max=Math.max(...items.map(x=>x[1]));return `<div class="bars">${items.map(([a,b])=>`<div class="bar-row"><span>${a}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(b/max*100)}%"></div></div><span class="bar-value">${n(b)}</span></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="card table-card"><div class="table-toolbar"><input class="search" id="searchInput" placeholder="Buscar registros..." value="${state.search}"><div class="filters"><select id="filterSelect"><option value="todos">Todos os status</option><option>Disponível</option><option>A revisar</option><option>Conferência</option><option>A caminho</option><option>Programado</option></select></div></div><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function estoqueDashboard(){let total=data.estoque.reduce((a,x)=>a+x.saldo,0),skus=data.estoque.length,locais=new Set(data.estoque.map(x=>x.local)).size;return hero('Estoque sob controle','Visão consolidada de saldo, ocupação e movimentações. A antiga área “Excesso” foi reorganizada como um módulo completo de estoque.')+`<div class="kpis">${kpi('Unidades em estoque',n(total),'12,4% acima da semana anterior','good')}${kpi('SKUs ativos',n(skus),'8 posições monitoradas')}${kpi('Endereços ocupados',n(locais),'74% da capacidade estimada','warn')}${kpi('Movimentações hoje','38','+11 desde 08:00','good')}</div><div class="grid2"><div class="card panel"><div class="panel-head"><div><h3>Volume por endereço</h3><small>Saldo físico nas principais zonas do estoque</small></div><span class="tag">Tempo real · demo</span></div>${bars([['Zona A',224],['Zona B',146],['Zona C',90],['Zona D',45]])}</div><div class="card panel"><div class="panel-head"><div><h3>Saúde do estoque</h3><small>Distribuição por faixa de disponibilidade</small></div></div><div class="ring-wrap"><div class="ring" style="--p:78"><div class="ring-center"><div><b>78%</b><span>saudável</span></div></div></div><div class="legend"><div><i></i> Disponível · 78%</div><div><i></i> Atenção · 16%</div><div><i></i> Crítico · 6%</div></div></div></div></div>`+stockTable();}
function stockTable(){let q=state.search.toLowerCase();let rows=data.estoque.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q)).map(x=>`<tr><td class="mono">${x.sku}</td><td>${x.produto}</td><td>${x.marca}</td><td class="mono">${x.local}</td><td>${x.caixa}</td><td class="mono">${x.saldo}</td><td><span class="status ${statusClass(x.status)}">${x.status}</span></td></tr>`);return table(['SKU','Produto','Marca','Local','Caixa','Saldo','Status'],rows)}
function movimentos(){let rows=data.movimentos.filter(x=>!state.search||Object.values(x).join(' ').toLowerCase().includes(state.search.toLowerCase())).map(x=>`<tr><td>${x.data}</td><td><span class="status ${x.tipo==='Entrada'?'green':x.tipo==='Retirada'?'amber':'blue'}">${x.tipo}</span></td><td class="mono">${x.sku}</td><td class="mono">${x.qtd}</td><td>${x.origem}</td><td>${x.responsavel}</td></tr>`);return hero('Movimentações','Rastreabilidade de entradas, saídas e transferências, com histórico operacional.')+table(['Data','Tipo','SKU','Qtd.','Origem / destino','Responsável'],rows)}
function stockMap(){return hero('Mapa de estoque','Visualização simplificada dos endereços físicos e sua taxa de ocupação.','Endereçamento')+`<div class="stock-map">${['Zona A','Zona B','Zona C','Zona D'].map((z,zi)=>`<div class="rack"><h4>${z}</h4><div class="bins">${Array.from({length:9},(_,i)=>`<div class="bin ${((i+zi)%4===0)?'hot':((i+zi)%3===0)?'full':''}">${z.slice(-1)}-${String(i+1).padStart(2,'0')}</div>`).join('')}</div></div>`).join('')}</div>`}
function formPage(kind){let isEntrada=kind==='entrada';return hero(isEntrada?'Entrada de estoque':'Retirada de estoque',isEntrada?'Registre novas unidades e associe-as a um endereço físico.':'Dê baixa no saldo com rastreabilidade de motivo e responsável.','Movimentação')+`<div class="card form-card"><div class="form-grid"><div class="field"><label>SKU</label><select id="fsku">${data.estoque.map(x=>`<option>${x.sku} — ${x.produto}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="fqtd" type="number" min="1" value="12"></div><div class="field"><label>Local</label><select id="flocal"><option>A-01</option><option>A-02</option><option>B-01</option><option>C-02</option><option>D-01</option></select></div><div class="field"><label>Responsável</label><input id="fresp" value="Mariana Costa"></div><div class="field full"><label>${isEntrada?'Origem':'Motivo da retirada'}</label><select id="fmotivo"><option>${isEntrada?'Recebimento de compra':'Separação para pedido'}</option><option>${isEntrada?'Retorno de devolução':'Ajuste operacional'}</option><option>${isEntrada?'Ajuste de inventário':'Avaria / descarte'}</option></select></div><div class="field full"><label>Observação</label><textarea id="fobs" placeholder="Inclua uma observação opcional..."></textarea></div></div><div class="note">Este formulário é demonstrativo e usa apenas dados fictícios. Nenhuma informação é enviada a um backend real.</div><div class="form-actions"><button class="ghost" onclick="render()">Cancelar</button><button class="primary" onclick="saveMovement('${isEntrada?'Entrada':'Retirada'}')">Registrar ${isEntrada?'entrada':'retirada'}</button></div></div>`}
function devolDashboard(){return hero('Devoluções','Acompanhe o ciclo de retorno, triagem e reintegração ao estoque.')+`<div class="kpis">${kpi('Recebidas no mês','184','+7,6% vs. mês anterior','warn')}${kpi('Aguardando revisão','12','6 com mais de 24h','bad')}${kpi('Reintegradas ao estoque','129','70,1% das recebidas','good')}${kpi('Tempo médio','1,8 dia','-0,3 dia no período','good')}</div><div class="grid2"><div class="card panel"><div class="panel-head"><div><h3>Principais motivos</h3><small>Ocorrências no mês corrente</small></div></div>${bars([['Arrependimento',68],['Embalagem',41],['Divergência',29],['Desistência',24],['Outros',22]])}</div><div class="card panel"><div class="panel-head"><div><h3>Destino após conferência</h3><small>Tratamento físico dos itens devolvidos</small></div></div><div class="ring-wrap"><div class="ring" style="--p:70"><div class="ring-center"><div><b>70%</b><span>reintegrado</span></div></div></div><div class="legend"><div><i></i> Volta ao estoque</div><div><i></i> Revisão adicional</div><div><i></i> Descarte</div></div></div></div></div>`+devolTable();}
function devolTable(filter){let rows=data.devolucoes.filter(x=>!filter||x.status===filter).map(x=>`<tr><td class="mono">${x.pedido}</td><td>${x.market}</td><td class="mono">${x.sku}</td><td>${x.qtd}</td><td>${x.motivo}</td><td>${x.data}</td><td><span class="status ${statusClass(x.status)}">${x.status}</span></td></tr>`);return table(['Pedido','Canal','SKU','Qtd.','Motivo','Recebido','Status'],rows)}
function recebDashboard(){return hero('Recebimento','Planejamento de compras em trânsito, conferência e processamento de entrada.')+`<div class="kpis">${kpi('Unidades previstas','1.689','próximos 7 dias')}${kpi('Cargas em trânsito','3','2 chegam hoje','warn')}${kpi('Em conferência','216','9 volumes','warn')}${kpi('OTIF fornecedores','94,2%','+1,8 p.p. no mês','good')}</div><div class="grid2"><div class="card panel"><div class="panel-head"><div><h3>Previsão por dia</h3><small>Unidades esperadas</small></div></div>${bars([['25 set',636],['26 set',580],['27 set',305],['28 set',168]])}</div><div class="card panel"><div class="panel-head"><div><h3>Desempenho de recebimento</h3><small>Percentual processado no prazo</small></div></div><div class="ring-wrap"><div class="ring" style="--p:94"><div class="ring-center"><div><b>94%</b><span>no prazo</span></div></div></div><div class="legend"><div><i></i> No prazo · 94%</div><div><i></i> Com ressalva · 4%</div><div><i></i> Atrasado · 2%</div></div></div></div></div>`+recebTable();}
function recebTable(filter){let rows=data.recebimentos.filter(x=>!filter||x.status===filter).map(x=>`<tr><td>${x.fornecedor}</td><td class="mono">${x.nf}</td><td>${x.previsao}</td><td>${x.volumes}</td><td class="mono">${n(x.unidades)}</td><td><span class="status ${statusClass(x.status)}">${x.status}</span></td></tr>`);return table(['Fornecedor','Nota fiscal','Previsão','Volumes','Unidades','Status'],rows)}
function genericForm(type){let title=type==='nova'?'Nova devolução':'Nova compra';let sub=type==='nova'?'Registre o retorno de um pedido para iniciar o fluxo de revisão.':'Cadastre uma compra prevista e acompanhe a chegada dos volumes.';return hero(title,sub,'Novo registro')+`<div class="card form-card"><div class="form-grid"><div class="field"><label>${type==='nova'?'Número do pedido':'Fornecedor'}</label><input value="${type==='nova'?'#MLB-892104':'Orion Distribuidora'}"></div><div class="field"><label>${type==='nova'?'Marketplace':'Nota fiscal'}</label><select><option>${type==='nova'?'Mercado Livre':'NF 0008531'}</option><option>${type==='nova'?'Shopee':'NF 0008532'}</option></select></div><div class="field"><label>${type==='nova'?'SKU':'Previsão de chegada'}</label><input value="${type==='nova'?'SKU-2071':'29/09/2026'}"></div><div class="field"><label>${type==='nova'?'Quantidade':'Volumes'}</label><input type="number" value="${type==='nova'?'1':'12'}"></div><div class="field full"><label>Observações</label><textarea placeholder="Observação opcional..."></textarea></div></div><div class="note">Registro demonstrativo: os dados não persistem fora desta sessão.</div><div class="form-actions"><button class="ghost">Cancelar</button><button class="primary" onclick="showToast('Registro fictício salvo para demonstração.')">Salvar registro</button></div></div>`}
function positions(){return hero('Posições atuais','Consulta rápida de saldo por SKU, endereço físico, produto e marca.','Estoque físico')+stockTable()}
function render(){
 document.querySelector('#moduleSwitch').innerHTML=Object.entries(modules).map(([k,v])=>`<button class="module-btn ${state.module===k?'active':''}" onclick="setModule('${k}')">${v.label}</button>`).join('');
 let mod=modules[state.module];document.querySelector('#navTitle').textContent=mod.label;document.querySelector('#nav').innerHTML=mod.pages.map(([k,l])=>`<button class="${state.page===k?'active':''}" onclick="setPage('${k}')"><span class="dot"></span>${l}</button>`).join('');
 document.querySelector('#crumbModule').textContent=mod.label;document.querySelector('#crumbPage').textContent=mod.pages.find(x=>x[0]===state.page)?.[1]||'';
 let html='';
 if(state.module==='estoque') html=state.page==='dashboard'?estoqueDashboard():state.page==='entrada'||state.page==='retirada'?formPage(state.page):state.page==='movimentacoes'?movimentos():state.page==='mapa'?stockMap():positions();
 if(state.module==='devolucoes') html=state.page==='dashboard'?devolDashboard():state.page==='nova'?genericForm('nova'):state.page==='revisar'?hero('Devoluções a revisar','Fila de ocorrências que ainda exigem análise operacional.')+devolTable('A revisar'):state.page==='conferencia'?hero('Conferência de estoque','Itens liberados para inspeção física antes do destino final.')+devolTable('Conferência'):hero('Histórico de devoluções','Consulta consolidada de todos os registros demonstrativos.')+devolTable();
 if(state.module==='recebimento') html=state.page==='dashboard'?recebDashboard():state.page==='compra'?genericForm('compra'):state.page==='caminho'?hero('Compras a caminho','Acompanhe cargas em trânsito e previsão de chegada.')+recebTable('A caminho'):state.page==='conferencia'?hero('Conferência de recebimento','Validação de volumes e unidades recebidas.')+recebTable('Conferência'):hero('Recebimentos processados','Histórico de entradas concluídas no período.')+recebTable();
 document.querySelector('#content').innerHTML=html;bindControls();
}
function bindControls(){let s=document.querySelector('#searchInput');if(s)s.addEventListener('input',e=>{state.search=e.target.value;render()});}
function setModule(m){state.module=m;state.page='dashboard';state.search='';render()}function setPage(p){state.page=p;state.search='';render()}
function saveMovement(tipo){let sku=document.querySelector('#fsku').value.split(' — ')[0],qtd=Number(document.querySelector('#fqtd').value)||1;data.movimentos.unshift({data:'25/09 09:40',tipo,sku,qtd,origem:document.querySelector('#fmotivo').value,responsavel:document.querySelector('#fresp').value});showToast(`${tipo} registrada na demonstração.`);state.page='movimentacoes';render()}
function showToast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2600)}
function exportCSV(){let rows=[['SKU','Produto','Marca','Local','Caixa','Saldo','Status'],...data.estoque.map(x=>[x.sku,x.produto,x.marca,x.local,x.caixa,x.saldo,x.status])];let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(';')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logiflow_estoque_demo.csv';a.click();URL.revokeObjectURL(a.href);showToast('CSV demonstrativo exportado.')}
document.querySelector('#exportBtn').onclick=exportCSV;document.querySelector('#quickBtn').onclick=()=>{state.module='estoque';state.page='entrada';render()};render();
</script>
</body>
</html>
